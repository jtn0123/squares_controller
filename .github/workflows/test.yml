name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # coverage and mypy are CI-only dev dependencies; the runtime stays
      # stdlib-only.
      - run: python -m pip install coverage==7.15.4 mypy==2.3.0
      - run: python -m mypy
      - run: python -m coverage run --source=src -m unittest discover -s test -p 'test_*.py' -v
      - run: python -m coverage report --fail-under=75

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the documented floor; 22 is current.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts: typescript is the only dependency and needs no
      # lifecycle scripts; this blocks supply-chain install hooks.
      - run: npm ci --ignore-scripts
      # The strict TypeScript compile IS the type gate; it also emits the
      # JS and assembles index.html that the tests and server run against.
      - run: npm run build
      - run: node --test --experimental-test-coverage test/*.test.mjs

  # Stable check name for branch protection. Matrix jobs report per-entry
  # names ("frontend (20)"), so pinning protection to them would break
  # every time the matrix changes; this gate keeps one fixed contract.
  browser-models:
    needs: frontend
    # always() + an explicit result check: a skipped required job would
    # otherwise be reported to branch protection as success.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.frontend.result }}" = "success" ]'
